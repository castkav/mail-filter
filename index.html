<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working sheet, input left, clean list right; stacks to one column on phones */
:root {
  --bg: #eef1f6;
  --paper: #ffffff;
  --ink: #18223a;
  --muted: #5c6780;
  --line: #d4dae6;
  --accent: #2346a8;
  --accent-ink: #ffffff;
  --ok: #1d7a4c;
  --mark: #e7ecfa;
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151f; --paper: #191f2c; --ink: #e5e9f2; --muted: #98a2b8; --line: #2c3446;
    --accent: #7d9bf0; --accent-ink: #0f1424; --ok: #5cc994; --mark: #232c42; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151f; --paper: #191f2c; --ink: #e5e9f2; --muted: #98a2b8; --line: #2c3446;
  --accent: #7d9bf0; --accent-ink: #0f1424; --ok: #5cc994; --mark: #232c42; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2rem; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
header p { margin: 0; color: var(--muted); max-width: 65ch; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 1.6rem; } }
.pane { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stats { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }
textarea { width: 100%; min-height: 440px; resize: vertical; border: 0; background: transparent; color: var(--ink); padding: 14px; font-family: var(--f-mono); font-size: 0.85rem; line-height: 1.65; outline: none; white-space: pre; overflow: auto; }
textarea:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 0 0 10px 10px; }
#out { background: var(--mark); border-radius: 0 0 10px 10px; }
.pane-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
button { font-family: var(--f-body); font-size: 0.95rem; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.08); }
.toast { font-size: 0.9rem; color: var(--ok); font-weight: 600; }
.foot-note { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 65ch; }
@media (prefers-reduced-motion: no-preference) { button { transition: filter .15s, border-color .15s; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Mail <span>Filter</span></h1>
    <p>Vlož seznam z Wordu (názvy firem + maily). Vpravo zůstanou jen řádky s e-maily, pod sebou, připravené ke zkopírování.</p>
  </header>

  <div class="grid">
    <section class="pane" aria-labelledby="in-label">
      <div class="pane-head">
        <span class="label" id="in-label">Vstup z Wordu</span>
        <span class="stats" id="in-stats"></span>
      </div>
      <textarea id="in" spellcheck="false" placeholder="Sem vlož seznam (Ctrl+V)…"></textarea>
      <div class="pane-foot">
        <button type="button" id="paste-new">Vymazat a vložit nový</button>
      </div>
    </section>

    <section class="pane" aria-labelledby="out-label">
      <div class="pane-head">
        <span class="label" id="out-label">Jen e-maily</span>
        <span class="stats" id="out-stats"></span>
      </div>
      <textarea id="out" readonly spellcheck="false" placeholder="Tady se objeví jen e-maily, každá firma na svém řádku."></textarea>
      <div class="pane-foot">
        <button type="button" class="primary" id="copy">Zkopírovat e-maily</button>
        <span class="toast" id="toast" role="status" aria-live="polite"></span>
      </div>
    </section>
  </div>

  <p class="foot-note">Řádek se dvěma adresami zůstane jako jeden řádek (adresy oddělené středníkem). Text bez zavináče se vynechá.</p>
</div>

<script>
const EMAIL = /[A-Z0-9._%+'\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}/gi;
const $in = document.getElementById('in');
const $out = document.getElementById('out');
const $toast = document.getElementById('toast');

function extract(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    const found = line.match(EMAIL);
    if (!found) continue;
    const seen = new Set();
    const uniq = found.filter(m => { const k = m.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    rows.push(uniq.join(';'));
  }
  return rows;
}

function plural(n, one, few, many) { return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }

function render() {
  const rows = extract($in.value);
  const count = rows.reduce((s, r) => s + r.split(';').length, 0);
  $out.value = rows.join('\n');
  const lines = $in.value ? $in.value.split(/\r?\n/).length : 0;
  document.getElementById('in-stats').innerHTML = `<b>${lines}</b> ${plural(lines, 'řádek', 'řádky', 'řádků')}`;
  document.getElementById('out-stats').innerHTML =
    `<b>${rows.length}</b> ${plural(rows.length, 'řádek', 'řádky', 'řádků')} · <b>${count}</b> ${plural(count, 'adresa', 'adresy', 'adres')}`;
  $toast.textContent = '';
}

document.getElementById('copy').addEventListener('click', async () => {
  if (!$out.value) { $toast.textContent = 'Není co kopírovat – vlož nejdřív seznam vlevo.'; return; }
  try {
    await navigator.clipboard.writeText($out.value);
    $toast.textContent = 'Zkopírováno – vlož Ctrl+V';
  } catch (e) {
    $out.focus(); $out.select();
    $toast.textContent = 'Text je označený – zkopíruj Ctrl+C';
  }
});

document.getElementById('paste-new').addEventListener('click', () => {
  $in.value = ''; render(); $in.focus();
});

$out.addEventListener('focus', () => $out.select());
$in.addEventListener('input', render);

render();
$in.focus();
</script>
</body>
</html>
